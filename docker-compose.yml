# Runs Meilisearch locally. Start with: docker compose up -d
services:
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: catalog-meili
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: change-me-master-key
      MEILI_ENV: development
    volumes:
      - ./meili_data:/meili_data
